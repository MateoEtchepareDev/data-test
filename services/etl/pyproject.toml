[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etl"
version = "0.1.0"
description = "ETL: Excel de origen -> modelo dimensional en Supabase"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "openpyxl>=3.1", "psycopg2-binary>=2.9.10"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]